<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DistriLink</title>
  <script type="module">
    import { getUser } from "/js/session.js";
    import { ROUTES } from "/js/config.js";
    const user = getUser();
    window.location.replace(user ? ROUTES.home[user.role] : ROUTES.login);
  </script>
</head>
<body>
  <noscript>DistriLink necesita JavaScript activado.</noscript>
</body>
</html>
