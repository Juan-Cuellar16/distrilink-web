<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DistriLink</title>
  <script type="module">
    import { getUser } from "/js/session.js";
    import { ROUTES, DEV_MODE, loginPage } from "/js/config.js";
    const user = getUser();
    // While DEV_MODE is on, the home pages may not exist yet: land on the template.
    const home = user && (DEV_MODE ? "/pages/plantilla.html" : ROUTES.home[user.role]);
    window.location.replace(home || loginPage());
  </script>
</head>
<body>
  <noscript>DistriLink necesita JavaScript activado.</noscript>
</body>
</html>
